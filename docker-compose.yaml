services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: f1_rag
      POSTGRES_USER: f1
      POSTGRES_PASSWORD: f1pass
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./sql/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U f1 -d f1_rag"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
    driver: local
